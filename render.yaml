services:
  - type: web
    name: o-benedito-demo
    runtime: static
    repo: https://github.com/endlandpage/oBenedito
    branch: main
    buildCommand: node build-public.cjs
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'none'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'none'; script-src 'self'; script-src-attr 'none'; style-src 'self' 'unsafe-inline'; style-src-elem 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data: blob: https://hzjfcsedzqjwwkvutwvm.supabase.co; font-src 'self'; media-src 'self' blob:; connect-src 'self' https://hzjfcsedzqjwwkvutwvm.supabase.co; frame-src https://maps.google.com https://www.google.com; worker-src 'none'; manifest-src 'self'; upgrade-insecure-requests"
      - path: /*
        name: X-Frame-Options
        value: "DENY"
      - path: /*
        name: X-Content-Type-Options
        value: "nosniff"
      - path: /*
        name: Referrer-Policy
        value: "strict-origin-when-cross-origin"
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=()"
